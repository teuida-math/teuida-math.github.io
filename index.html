<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>트이다 수학학원 · 부산</title>
<meta name="description" content="부산 트이다 수학학원 — 왜 틀리는지의 구조를 가르칩니다. 상담·자료·지점 안내.">

<!-- 카카오톡/인스타 공유 미리보기 -->
<meta property="og:type" content="website">
<meta property="og:title" content="트이다 수학학원 · 부산">
<meta property="og:description" content="왜 틀리는지의 구조를 가르칩니다. 고등 수학 심화.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --navy:#1B2A4A;
    --orange:#E8650A;
    --gold:#F2B544;
    --paper:#f4f2ee;
    --line:#e4dfd4;
    --muted:#8a8578;
    --card:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:'IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--paper);
    color:var(--navy);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:48px 20px 40px;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  .wrap{width:100%;max-width:460px;}

  /* ── 헤더 ── */
  .head{text-align:center;margin-bottom:34px;}
  .mark{
    display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
    width:80px;height:80px;border-radius:22px;
    background:var(--navy);
    margin-bottom:18px;
    box-shadow:0 10px 30px rgba(27,42,74,.22);
  }
  .mark span{
    font-size:21px;font-weight:700;color:#fff;letter-spacing:-.02em;line-height:1;
  }
  .mark i{
    display:block;width:26px;height:4px;border-radius:2px;
    background:var(--orange);margin-top:8px;
  }
  h1{font-size:30px;font-weight:700;letter-spacing:-.03em;}
  h1 .dot{color:var(--orange);}
  .tagline{
    margin-top:12px;font-size:16px;font-weight:500;color:var(--navy);
    line-height:1.55;
  }
  .tagline b{color:var(--orange);font-weight:600;}
  .meta{
    margin-top:14px;font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;color:var(--muted);letter-spacing:.02em;
  }
  .meta .sep{color:var(--line);margin:0 7px;}

  /* ── 버튼 ── */
  .links{display:flex;flex-direction:column;gap:13px;margin-top:6px;}
  .btn{
    display:flex;align-items:center;gap:15px;
    width:100%;padding:17px 20px;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:16px;
    color:var(--navy);
    text-decoration:none;
    font-size:16.5px;font-weight:600;letter-spacing:-.01em;
    transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
    position:relative;
  }
  .btn:hover,.btn:active{
    transform:translateY(-2px);
    box-shadow:0 8px 22px rgba(27,42,74,.10);
    border-color:#d5cfc0;
  }
  .btn .ico{flex:0 0 24px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--navy);}
  .btn .ico svg{width:22px;height:22px;}
  .btn .txt{flex:1;}
  .btn .sub{display:block;font-size:12.5px;font-weight:400;color:var(--muted);margin-top:2px;}
  .btn .chev{flex:0 0 auto;color:var(--line);transition:transform .14s ease,color .14s;}
  .btn:hover .chev{transform:translateX(3px);color:var(--orange);}

  /* 주 CTA — 상담 신청 */
  .btn.primary{
    background:var(--navy);border-color:var(--navy);color:#fff;
    box-shadow:0 10px 26px rgba(27,42,74,.22);
  }
  .btn.primary .ico,.btn.primary .chev{color:var(--gold);}
  .btn.primary .sub{color:#b8c2d2;}
  .btn.primary:hover{box-shadow:0 14px 32px rgba(27,42,74,.30);}

  /* 카카오 */
  .btn.kakao .ico{color:#3b1e1e;}

  /* 설정 필요(빈 링크) 표시 — 실제 링크 넣으면 사라짐 */
  .btn.todo{opacity:.55;cursor:default;}
  .btn.todo:hover{transform:none;box-shadow:none;border-color:var(--line);}
  .btn.todo .chev{display:none;}
  .btn.todo .flag{
    flex:0 0 auto;font-size:11px;font-weight:600;color:#fff;
    background:var(--orange);padding:4px 9px;border-radius:20px;
    font-family:'IBM Plex Sans KR';letter-spacing:0;
  }

  /* 구분 라벨 */
  .grouplabel{
    font-size:12px;font-weight:600;color:var(--muted);
    letter-spacing:.06em;text-transform:uppercase;
    margin:24px 4px 2px;
  }

  /* ── 푸터 ── */
  .foot{text-align:center;margin-top:36px;padding-top:22px;border-top:1px solid var(--line);}
  .foot .name{font-size:14px;font-weight:700;color:var(--navy);}
  .foot .loc{margin-top:6px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);}

  /* 진입 애니메이션 */
  @media (prefers-reduced-motion:no-preference){
    .anim{opacity:0;transform:translateY(14px);animation:rise .5s ease forwards;}
    @keyframes rise{to{opacity:1;transform:none;}}
  }
</style>
</head>
<body>
  <div class="wrap">

    <div class="head anim" style="animation-delay:.02s">
      <div class="mark"><span>트이다</span><i></i></div>
      <h1>트이다 수학학원<span class="dot">.</span></h1>
      <p class="tagline">외우는 수학이 아니라,<br><b>왜 틀리는지의 구조</b>를 가르칩니다.</p>
      <p class="meta">부산 <span class="sep">·</span> 용호점 / 센텀점 <span class="sep">·</span> 고등 수학 심화</p>
    </div>

    <div class="links" id="links"><!-- JS가 채웁니다 --></div>

    <div class="foot anim" style="animation-delay:.5s">
      <div class="name">트이다 수학학원</div>
      <div class="loc">TEUIDA MATH · BUSAN</div>
    </div>

  </div>

<script>
/* ═══════════════════════════════════════════════════════════════
   ⬇ 여기만 고치면 됩니다. 링크를 채우면 버튼이 자동으로 활성화됩니다.
   비워두면 '링크 입력 필요' 표시만 뜨고, 클릭되지 않습니다.
   ═══════════════════════════════════════════════════════════════ */
const CONFIG = {
  consult:   "https://teuida-app.vercel.app/consult",     // 무료 상담·체험 신청 (트이다 앱)
  kakaoY:    "https://pf.kakao.com/_xnxiBGn",             // 카카오톡 채널 — 용호점 (@트이다수학)
  kakaoC:    "https://pf.kakao.com/_xjlNBX",              // 카카오톡 채널 — 센텀점
  tel:       "010-3934-4479",                             // 전화번호
  yongho:    "https://teuida-math.github.io/yongho/",  // 용호점 2학기 안내·시간표
  centum:    "https://teuida-math.github.io/centum/",  // 센텀점 2학기 안내·시간표
  location:  "https://teuida-app.vercel.app/location",    // 오시는 길 (용호·센텀 주소·지도)
  library:   "study/",   // 심화 학습지 공개 자료실
  instagram: "https://instagram.com/teuidamath"           // 인스타 핸들 (확인 필요)
};
/* ═══════════════════════════════════════════════════════════════ */

const IC = {
  spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.2"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.5L3 21l1.9-4.1A8.5 8.5 0 1 1 21 11.5z"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.5 2.1L8.1 9.6a16 16 0 0 0 6 6l1.2-1.1a2 2 0 0 1 2.1-.5c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2z"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  insta:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
  chev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>'
};

// 표시할 버튼 정의 (순서 = 화면 순서)
const ITEMS = [
  {group:"심화 학습 자료"},
  {key:"library", cls:"primary", ico:IC.book, label:"심화 개념 학습지 자료실", sub:"인스타 개념 카드 원본 · 무료로 보기"},

  {group:"상담 · 문의"},
  {key:"consult", cls:"", ico:IC.spark, label:"무료 상담 · 체험 신청", sub:"1분이면 신청 완료"},
  {key:"kakaoY",  cls:"kakao", ico:IC.chat,  label:"카카오톡 상담 · 용호점", sub:"남구 용호동"},
  {key:"kakaoC",  cls:"kakao", ico:IC.chat,  label:"카카오톡 상담 · 센텀점", sub:"해운대구 센텀"},
  {key:"tel",     cls:"",      ico:IC.phone, label:"전화 문의",            sub:"", tel:true},

  {group:"지점 안내"},
  {key:"yongho",   cls:"", ico:IC.clock, label:"용호점 수업 안내 · 시간표", sub:"남구 용호동"},
  {key:"centum",   cls:"", ico:IC.clock, label:"센텀점 수업 안내 · 시간표", sub:"해운대구 센텀"},
  {key:"location", cls:"", ico:IC.pin,   label:"오시는 길 (용호 · 센텀)",   sub:"주소 · 지도 보기"},

  {group:"소식"},
  {key:"instagram", cls:"", ico:IC.insta, label:"인스타그램 @teuidamath", sub:"매주 새 개념 카드 업로드"}
];

const root = document.getElementById('links');
let delay = 0.06;
ITEMS.forEach(it=>{
  if(it.group){
    const l = document.createElement('div');
    l.className = 'grouplabel anim';
    l.style.animationDelay = delay.toFixed(2)+'s';
    l.textContent = it.group;
    root.appendChild(l);
    delay += 0.05;
    return;
  }
  const url = CONFIG[it.key];
  const a = document.createElement('a');
  a.className = 'btn anim ' + (it.cls||'');
  a.style.animationDelay = delay.toFixed(2)+'s';
  delay += 0.05;

  if(url){
    a.href = it.tel ? ('tel:'+url.replace(/[^0-9+]/g,'')) : url;
    if(!it.tel){ a.target='_blank'; a.rel='noopener'; }
  }else{
    a.classList.add('todo');
    a.removeAttribute('href');
  }

  const subHtml = it.sub ? `<span class="sub">${it.sub}</span>` : '';
  const displaySub = (it.tel && url) ? `<span class="sub">${url}</span>` : subHtml;
  a.innerHTML =
    `<span class="ico">${it.ico}</span>`+
    `<span class="txt">${it.label}${displaySub}</span>`+
    (url ? `<span class="chev">${IC.chev}</span>` : `<span class="flag">링크 입력 필요</span>`);
  root.appendChild(a);
});
</script>
</body>
</html>
